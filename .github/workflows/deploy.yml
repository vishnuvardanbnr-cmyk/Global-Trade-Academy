name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile — no conflicts)
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: BASE_PATH=/ PORT=3000 pnpm --filter @workspace/edu run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy API to VPS
        run: |
          tar -czf /tmp/api-dist.tar.gz -C artifacts/api-server dist/
          scp /tmp/api-dist.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/
          ssh root@${{ secrets.VPS_HOST }} \
            "tar -xzf /tmp/api-dist.tar.gz -C /opt/brightinsight/artifacts/api-server/ && pm2 restart brightinsight-api"

      - name: Deploy frontend to VPS
        run: |
          tar -czf /tmp/edu-dist.tar.gz -C artifacts/edu dist/
          scp /tmp/edu-dist.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/
          ssh root@${{ secrets.VPS_HOST }} \
            "tar -xzf /tmp/edu-dist.tar.gz -C /opt/brightinsight/artifacts/edu/"
